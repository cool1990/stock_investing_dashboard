name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # GITHUB_TOKEN pushes from data.yml do not trigger another workflow's `push`.
  workflow_run:
    workflows: ["Daily data refresh", "Earnings night snapshot"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install & build
        working-directory: web
        env:
          # 「添加股票」链接：用 GITHUB_REPOSITORY 拼接，避免写死
          VITE_ADD_STOCK_URL: https://github.com/${{ github.repository }}/blob/main/config/watchlist.yaml
        run: |
          npm ci
          npm run build
      - name: Copy data into dist
        run: |
          mkdir -p web/dist/data
          cp -R data/* web/dist/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
