# Snapshot prices after the close and rebuild reaction / review pages.
name: Earnings night snapshot
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: Ticker
        default: MU
        required: true

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh prices + rebuild price/review
        run: |
          T=${{ github.event.inputs.ticker || 'MU' }}
          python3 scripts/fetch_prices.py --ticker "$T"
          python3 scripts/build_page_price.py --ticker "$T"
          python3 scripts/build_page_review.py --ticker "$T"
          python3 scripts/build_page_header.py --ticker "$T"
          python3 scripts/build_page_watchlist.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/public/data
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "chore(data): earnings-night snapshot"
            git push
          fi
