name: Daily data refresh
on:
  schedule:
    # Weekdays ~22:30 UTC (after US close; ~06:30 Beijing next day)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Settings → Variables → SEC_USER_AGENT (Variable, not Secret)
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Refresh the whole watchlist
        run: python3 scripts/run_watchlist.py
      - name: Verify absolute period keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re, sys
          bad_files = []
          snaps = sorted(Path("data/snapshots").glob("*/*.json"))
          dated = [p for p in snaps if re.fullmatch(r"\d{4}-\d{2}-\d{2}", p.stem)]
          if not dated:
              print("ERROR: no dated snapshots"); sys.exit(1)
          for path in dated:
              d = json.loads(path.read_text())
              keys = list((d.get("periods") or {}).keys())
              bad = [k for k in keys if not re.fullmatch(r"(FQ[1-4]|FY)\d{2}", k)]
              if bad:
                  bad_files.append((str(path), bad))
          if bad_files:
              raise SystemExit(f"non-absolute period keys: {bad_files}")
          print("checked", len(dated), "dated snapshots")
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data web/public/data ai/tasks
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): refresh watchlist $(date -u +%Y-%m-%d)"
            git push
          fi
