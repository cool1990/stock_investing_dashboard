name: Restore P0 tree from chunks
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/restore-p0/**"
      - ".github/workflows/restore-p0.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and extract
        run: |
          set -euo pipefail
          cat .github/restore-p0/chunk_* | base64 -d > /tmp/p0-tree.tar.gz
          tar -xzf /tmp/p0-tree.tar.gz -C .
          rm -rf .github/restore-p0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes after restore"
          else
            git commit -m "chore: restore P0 full tree from agent sync chunks"
            git push
          fi
